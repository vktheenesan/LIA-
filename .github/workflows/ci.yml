name: LIA Core CI/CD & Zero-Trust Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography reportlab pytest

    - name: Run Core Unit & Integration Tests
      run: |
        python run_tests.py

    - name: Run 10 Un-Fakable Zero-Trust Verification Benchmarks
      run: |
        python benchmarks/run_all_benchmarks.py

    - name: Generate Publication-Grade PDF Reports
      run: |
        python scripts/generate_verification_pdf.py
        python scripts/generate_individual_test_pdfs.py

    - name: Archive Verification Artifacts & Reports
      uses: actions/upload-artifact@v4
      with:
        name: zero-trust-verification-reports
        path: |
          docs/UNFAKABLE_VERIFICATION_REPORT.md
          docs/LIA_Core_Zero_Trust_Verification_Report.pdf
          docs/pdf_reports/
          benchmarks/data/
