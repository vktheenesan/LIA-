name: LIA Core CI/CD & Zero-Trust Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography pytest

    - name: Run Core Unit & Integration Tests
      run: |
        python run_tests.py

    - name: Run 10 Un-Fakable Zero-Trust Verification Benchmarks
      run: |
        python benchmarks/run_all_benchmarks.py

    - name: Archive Verification Artifacts & Raw CSV/JSON Data
      uses: actions/upload-artifact@v3
      with:
        name: zero-trust-verification-report
        path: |
          docs/UNFAKABLE_VERIFICATION_REPORT.md
          benchmarks/data/
